# ProofOps UI server (M19b): unprivileged 8080, SPA fallback to index.
server {
  # Dual-stack: container localhost resolves to ::1 first (Docker/WSL);
  # without the v6 listen, wget http://localhost:8080/ gets refused and the
  # image + compose HEALTHCHECKs fail. The entrypoint ipv6 script only
  # rewrites port-80 lines, so pin both explicitly (proven by exec probe).
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Header/cookie tolerance. Observed failure: a browser whose cookie jar for
  # `localhost` had grown past ~8k got "400 Request Header Or Cookie Too
  # Large" from nginx's default large_client_header_buffers (4 8k) and the app
  # was unreachable on a stock demo URL. Cookies are per-domain, not
  # per-port, so every other app a developer runs on localhost piles onto this
  # request -- and a judge opening the same URL on a busy machine can hit it
  # too. This SPA sets and reads no cookies at all, so a large Cookie header
  # is pure noise here; raise the budget rather than 400 the whole product.
  large_client_header_buffers 8 32k;
  client_header_buffer_size 16k;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API proxy. The browser only ever talks to the origin it
  # loaded from, so the UI needs no CORS grant and the API surface does not
  # have to be widened to allow it. Without this, the SPA at :5173 called the
  # API at :8000 cross-origin, the backend sent no Access-Control-Allow-Origin
  # and answered no OPTIONS preflight, and every request failed as
  # "backend unreachable" -- the product was unreachable in its own container.
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE: /api/stream/incidents/{id} is a long-lived text/event-stream. Buffer
    # it and events arrive in a batch when the connection closes, which would
    # silently turn a live stream into a periodic poll. The read timeout must
    # also exceed the client reconnect backoff (30s) so a quiet stream is not
    # cut short between frames.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}
