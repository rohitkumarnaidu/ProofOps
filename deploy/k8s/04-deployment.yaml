apiVersion: apps/v1
kind: Deployment
metadata:
  name: proofops-api
  namespace: proofops
  labels:
    app.kubernetes.io/name: proofops-api
    app.kubernetes.io/part-of: proofops-control-plane
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: proofops-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proofops-api
        app.kubernetes.io/part-of: proofops-control-plane
    spec:
      serviceAccountName: proofops-agent-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/proofops/proofops-api:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: proofops-config
            - secretRef:
                name: proofops-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          volumeMounts:
            - name: state-storage
              mountPath: /app/var
            - name: tmp-storage
              mountPath: /tmp
      volumes:
        - name: state-storage
          emptyDir: {}
        - name: tmp-storage
          emptyDir:
            medium: Memory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proofops-ui
  namespace: proofops
  labels:
    app.kubernetes.io/name: proofops-ui
    app.kubernetes.io/part-of: proofops-control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: proofops-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proofops-ui
        app.kubernetes.io/part-of: proofops-control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: ui
          image: ghcr.io/proofops/proofops-ui:v1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
