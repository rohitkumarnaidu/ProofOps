apiVersion: v1
kind: ConfigMap
metadata:
  name: proofops-config
  namespace: proofops
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  EXECUTOR: "k8s"
  PROMETHEUS_URL: "http://prometheus-k8s.monitoring.svc.cluster.local:9090"
  DATABASE_URL: "postgresql+psycopg://proofops:proofops-secure-pass@postgres-cluster.database.svc.cluster.local:5432/proofops"
  PORT: "8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: proofops-secrets
  namespace: proofops
type: Opaque
stringData:
  # Master key for single-use HMAC token generation and verification
  APPROVAL_SECRET: "enterprise-hmac-master-key-prod-change-me"
  # API Key for control plane endpoints
  PROOFOPS_API_KEY: "proofops-prod-api-key-change-me"
  # Lyzr Studio API Key for LLM reasoning
  LYZR_API_KEY: ""
  # JWT Secret for RBAC and Operator authentication
  JWT_SECRET: "enterprise-jwt-signing-secret-change-me"
