apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proofops-zero-trust-netpol
  namespace: proofops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: proofops-control-plane
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic from Ingress controller to UI and API
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000 # API
        - protocol: TCP
          port: 8080 # UI
    # Allow Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # 1. Core DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2. Kubernetes API Server
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # 3. In-cluster Prometheus
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
    # 4. In-cluster PostgreSQL Database
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - protocol: TCP
          port: 5432
