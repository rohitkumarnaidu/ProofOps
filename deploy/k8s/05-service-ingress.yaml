apiVersion: v1
kind: Service
metadata:
  name: proofops-api
  namespace: proofops
  labels:
    app.kubernetes.io/name: proofops-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: proofops-api
---
apiVersion: v1
kind: Service
metadata:
  name: proofops-ui
  namespace: proofops
  labels:
    app.kubernetes.io/name: proofops-ui
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: proofops-ui
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proofops-ingress
  namespace: proofops
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - proofops.internal.enterprise.com
      secretName: proofops-tls-cert
  rules:
    - host: proofops.internal.enterprise.com
      http:
        paths:
          # Route API and webhooks to proofops-api
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: proofops-api
                port:
                  number: 8000
          - path: /alerts
            pathType: Prefix
            backend:
              service:
                name: proofops-api
                port:
                  number: 8000
          - path: /runs
            pathType: Prefix
            backend:
              service:
                name: proofops-api
                port:
                  number: 8000
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: proofops-api
                port:
                  number: 8000
          - path: /meta
            pathType: Prefix
            backend:
              service:
                name: proofops-api
                port:
                  number: 8000
          # Route all other UI requests to proofops-ui
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proofops-ui
                port:
                  number: 8080
