# ProofOps CI (M00.7 CI foundation): lockfile -> ruff -> mypy -> unit(host-safe) -> security.
#
# Source of truth: container python:3.12-slim (see backend/requirements.txt
# header). CI pins python 3.12 + `pip install -r backend/requirements.lock`
# (exact pins resolved for cp312/manylinux -- see ADR-010) so tool versions are
# deterministic, never host-drifted 3.13/3.14 + starlette v1.x that breaks
# fastapi.testclient on host. The lockfile job (5/5) fails first if the lock
# stops covering requirements (fail fast before 4 jobs burn compute).
#
# Host-safe honesty: the 4 `*_runtime.py` files need a live docker daemon and
# skip-or-fail without one, so the unit job EXCLUDES them via --ignore (exact
# list mirrored in scripts/ci.sh). The 1 remaining host skip
# (test_healthz_runtime_parity on drifted hosts) is reported, never faked.
# Container/runtime proofs stay owned by daemon runs (M00.3 matrix), not this
# pipeline.
#
# Secret safety (enforced by scripts/secret_scan.py in the security job):
# - this workflow NEVER echoes env or secrets (no `echo $`, no printenv);
# - NEVER runs plain `docker compose config` (renders env_file SECRET VALUES;
#   see docs/COMPOSE.md). Only `config --quiet` / `config --services` are safe,
#   and this pipeline needs neither, so compose is not invoked at all.
name: ci

on:
  push:
  pull_request:

# LACK-15 fix (least-privilege + no duplicate runs). This pipeline only reads
# the repo and runs tests, so `contents: read` suffices; concurrent runs on
# the same ref cancel (fail-fast, no stale green). Action SHA-pinning is a
# recorded P2 (needs verified SHAs; majors float today -- see ADR-008).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "1/5 ruff"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps (exact pins from lockfile, ADR-010)
        run: pip install -r backend/requirements.lock
      - name: Dependency consistency (gates the starlette upper bound)
        run: pip check
      - name: Ruff check (lint correctness; format not gated, see pyproject.toml)
        run: python -m ruff check backend tests scripts

  typecheck:
    name: "2/5 mypy"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps (exact pins from lockfile, ADR-010)
        run: pip install -r backend/requirements.lock
      - name: Dependency consistency (gates the starlette upper bound)
        run: pip check
      - name: Mypy (typed control plane)
        run: python -m mypy backend/app

  unit:
    name: "3/5 unit (host-safe)"
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps (exact pins from lockfile, ADR-010)
        run: pip install -r backend/requirements.lock
      - name: Dependency consistency (gates the starlette upper bound)
        run: pip check
      - name: Host-safe unit tests (runtime-daemon files excluded)
        run: >-
          python -m pytest tests/ -q
          --ignore=tests/test_compose_runtime.py
          --ignore=tests/test_config_runtime.py
          --ignore=tests/test_health_runtime.py
          --ignore=tests/test_logging_runtime.py

  security:
    name: "4/5 security (secret scan)"
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan (redacted output, never prints values)
        run: python scripts/secret_scan.py

  lockfile:
    name: "5/5 lockfile (freeze check)"
    runs-on: ubuntu-latest
    needs: [security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lock covers requirements with exact in-range pins
        run: python scripts/freeze.py --check
