services:
  # M00.3 restart policy (deliberate): unless-stopped everywhere. Recovers from
  # crashes and host/daemon reboots, but respects an explicit `docker compose
  # stop` (unlike `always`). `on-failure` was rejected: a config-broken api
  # would still loop under it, with no benefit over unless-stopped for dev/demo.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proofops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-proofops}
    ports:
      - "5433:5432"  # 5433 to avoid clashing with a host-local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-proofops}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-proofops}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-proofops}
      # Live tier. Both default to a non-live value so a plain `docker compose
      # up` on a clean clone is honest: no kubeconfig, no Prometheus, and the
      # health surface reports OFF rather than pretending. Run
      # `bash scripts/live_tier.sh up` to provision real ones.
      KUBECONFIG: ${KUBECONFIG:-/live/kubeconfig}
      # The namespace the agent identity is scoped to. This is not cosmetic: the
      # live ServiceAccount has a namespaced Role in exactly one namespace, so
      # probing anywhere else is a 403. Scoping the executor to the same
      # namespace the RBAC grants is what keeps "may act here, nowhere else"
      # true end to end.
      KUBERNETES_NAMESPACE: ${KUBERNETES_NAMESPACE:-proofops-demo}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://proofops-prometheus:9090}
      # Opt in to executing against the real cluster. Off by default: reaching a
      # cluster is not consent to mutate it. When on, a live failure propagates
      # rather than downgrading to the mock.
      LIVE_CLUSTER: ${LIVE_CLUSTER:-false}
      # Maps the scenario's bare version onto a real image so a rollback changes
      # something measured. Set by scripts/live_tier.sh.
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # api_state is the runtime state root resolved by app.paths.state_dir()
    # (/app/var in the image: the root context holds policies/ and runbooks/).
    # It carries the API-key store, approvals, runs, audit chains, and the
    # nonce journal. appuser cannot mkdir inside /app, so the image pre-creates
    # and chowns /app/var; an empty named volume inherits that ownership.
    volumes:
      - api_state:/app/var
      # The live tier's credentials and CA, mounted read-only and at a path
      # separate from the api_state volume. Read-only matters: this directory
      # holds a live ServiceAccount token, and an api container that could write
      # to its own credentials would be a self-escalation path. Absent on a clean
      # clone (scripts/live_tier.sh creates it), which compose tolerates.
      - ./var/live:/live:ro
    # The kind cluster and Prometheus both live on the external `kind` docker
    # network, so the api container joins it to reach the API server by its
    # in-network address. That address is a SAN on the apiserver certificate, so
    # TLS verifies for real -- going via host.docker.internal would have required
    # turning verification off, which this project should never do.
    networks:
      - default
      - kind
    # Explicit compose-level healthcheck mirroring the image HEALTHCHECK
    # (LACK-13 fix): `service_healthy` must not depend on an implicit image
    # contract. Same stdlib /healthz probe, same budgets as Dockerfile.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ui:
    build: ./frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "5173:8080"
    # Explicit compose-level healthcheck mirroring frontend/Dockerfile
    # (same wget / probe) for the same reason as api above.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  api_state:

networks:
  # Created by scripts/live_tier.sh (`kind create cluster` makes it). Declared
  # external so a clean clone does not fail to start before the live tier is
  # provisioned; `docker compose up` still works without it.
  kind:
    name: kind
    external: true
    internal: false
